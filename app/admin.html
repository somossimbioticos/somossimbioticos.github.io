<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administración · Simbi</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0B0F14">
  <script>try{if(localStorage.getItem("simb_tema")==="claro")document.documentElement.dataset.theme="light"}catch(e){}</script>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="../base.css">
  <style>
    .sugs { display: grid; gap: 10px; margin-bottom: 8px; max-height: 520px; overflow-y: auto; }
    .sug { background: var(--panel); border: 1px solid var(--linea); border-left: 3px solid var(--brasa); border-radius: 12px; padding: 12px 14px; }
    .sug.revisada { border-left-color: var(--cian); } .sug.hecha { border-left-color: var(--linea); opacity: .7; }
    .sug-cab { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
    .sug-cab small { color: var(--mut); flex: 1; }
    .sug p { margin: 8px 0 0; white-space: pre-wrap; line-height: 1.5; }
    .est-sug { width: auto; padding: 4px 8px; font-size: 12px; }
    body { min-height: 100vh; }
    .envoltura { width: min(1180px, 100% - 32px); margin: 0 auto; padding: 22px 0 60px; }
    .cab { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 26px; }
    .cab a.marca { display: flex; gap: 10px; align-items: center; text-decoration: none; color: var(--papel); }
    .cab h1 { font-size: 44px; }
    .cab .der { margin-left: auto; display: flex; gap: 10px; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 26px; }
    .kpi { background: var(--panel); border: 1px solid var(--linea); border-radius: 16px; padding: 16px 18px; }
    .kpi b { display: block; font-family: var(--f-titulo); font-size: 40px; line-height: 1; margin-top: 6px; }
    .kpi small { color: var(--mut); font-size: 12.5px; }
    h2 { font-family: var(--f-titulo); text-transform: uppercase; font-size: 30px; margin: 30px 0 12px; }
    .herr { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    .herr input, .herr select { background: var(--ink); border: 1px solid var(--linea); border-radius: 12px; padding: 10px 14px; color: var(--papel); }
    .herr input { flex: 1; min-width: 220px; }
    .tabla { overflow-x: auto; background: var(--panel); border: 1px solid var(--linea); border-radius: 16px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 11px 14px; text-align: left; border-bottom: 1px solid var(--linea); white-space: nowrap; }
    th { font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--mut); font-weight: 700; }
    tr:last-child td { border-bottom: 0; }
    td .correo { font-weight: 600; } td .nombre { color: var(--mut); font-size: 12.5px; }
    .interruptor { display: inline-flex; background: var(--ink); border-radius: 99px; padding: 3px; border: 1px solid var(--linea); }
    .interruptor button { border: 0; background: none; color: var(--mut); padding: 5px 12px; border-radius: 99px; cursor: pointer; font-weight: 600; font-size: 13px; }
    .interruptor button.on { background: var(--cian); color: var(--sobre-cian); }
    .interruptor button.on.gratis { background: var(--panel-2); color: var(--papel); }
    .celda-prueba { display: flex; align-items: center; gap: 8px; font-size: 12.5px; white-space: nowrap; }
    .celda-prueba .activa { color: var(--cian); } .celda-prueba .vencida { color: var(--error); }
    .btn-mini { border: 1px solid var(--linea); background: var(--panel-2); border-radius: 99px; padding: 3px 10px; cursor: pointer; font-size: 12px; }
    .btn-mini:hover { border-color: var(--cian); color: var(--cian); }
    .num { font-family: var(--f-mono); font-size: 13px; }
    .planes { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
    .plan { background: var(--panel); border: 1px solid var(--linea); border-radius: 16px; padding: 18px; }
    .plan h3 { margin: 0 0 12px; font-family: var(--f-titulo); text-transform: uppercase; font-size: 26px; }
    .plan label { display: grid; grid-template-columns: 1fr 140px; align-items: center; gap: 10px; font-size: 14px; color: #C9D6DB; margin-bottom: 8px; }
    .plan input { background: var(--ink); border: 1px solid var(--linea); border-radius: 10px; padding: 8px 10px; color: var(--papel); width: 100%; }
    .aviso { padding: 14px; border-radius: 12px; background: var(--brasa-suave); border: 1px solid rgba(255,77,46,.4); }
    .ok { color: var(--exito); font-size: 13px; margin-left: 10px; }
    dialog.chats { width: min(1100px, 100vw - 24px); height: min(820px, 100dvh - 24px); max-width: none; max-height: none; padding: 0; border: 1px solid var(--linea); border-radius: 18px; background: var(--ink); color: var(--papel); overflow: hidden; }
    dialog.chats[open] { display: flex; flex-direction: column; }
    dialog.chats::backdrop { background: rgba(0,0,0,.6); }
    .ch-cab { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--linea); background: var(--panel); }
    .ch-cab > div { flex: 1; min-width: 0; } .ch-cab small { display: block; color: var(--mut); font-size: 12.5px; margin-top: 2px; }
    .ch-cuerpo { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); }
    .ch-lista { overflow-y: auto; border-right: 1px solid var(--linea); padding: 10px; display: grid; gap: 6px; align-content: start; }
    .ch-conv { text-align: left; background: var(--panel); border: 1px solid var(--linea); border-radius: 12px; padding: 10px 12px; color: var(--papel); cursor: pointer; }
    .ch-conv:hover, .ch-conv.on { border-color: var(--cian); }
    .ch-conv b { display: block; font-size: 14px; overflow-wrap: anywhere; } .ch-conv small { color: var(--mut); font-size: 12px; }
    .ch-vista { overflow-y: auto; padding: 16px 20px 30px; display: flex; flex-direction: column; gap: 12px; }
    .ch-vista h3 { margin: 0 0 4px; font-size: 18px; overflow-wrap: anywhere; }
    .ch-msj { max-width: 85%; padding: 10px 14px; border-radius: 14px; border: 1px solid var(--linea); background: var(--panel); }
    .ch-msj.yo { align-self: flex-end; background: var(--panel-2); border-color: rgba(62,230,224,.35); }
    .ch-quien { font-size: 12px; font-weight: 700; color: var(--mut); margin-bottom: 4px; }
    .ch-texto { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.5; font-size: 14.5px; }
    .ch-msj small { display: block; margin-top: 6px; color: var(--mut); font-size: 11.5px; overflow-wrap: anywhere; }
    .ch-adjs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .ch-adj { font-size: 12.5px; background: var(--ink); border: 1px solid var(--linea); border-radius: 99px; padding: 3px 10px; overflow-wrap: anywhere; }
    .ch-volver { display: none; align-self: flex-start; }
    @media (max-width: 720px) {
      .ch-cuerpo { grid-template-columns: minmax(0, 1fr); }
      .ch-lista { border-right: 0; } .ch-cuerpo .ch-vista { display: none; }
      .ch-cuerpo.abierto .ch-lista { display: none; } .ch-cuerpo.abierto .ch-vista { display: flex; }
      .ch-volver { display: inline-block; } .ch-msj { max-width: 95%; }
    }
    .accesos { margin-top: 30px; } .accesos summary { cursor: pointer; font-weight: 600; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="envoltura">
    <div class="cab">
      <a class="marca" href="./"><img src="../logo.svg" alt="" width="36" height="36"></a>
      <h1 class="titulo">Administración</h1>
      <div class="der"><a class="btn btn-borde" href="./">← Volver a Simbi</a></div>
    </div>
    <div id="contenido"><p class="mono">Cargando…</p></div>
  </div>
  <script type="module" src="admin.js"></script>
</body>
</html>
